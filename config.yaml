# carbonverify pipeline configuration

scoring:
  # Discrepancy thresholds (percentage difference between claimed and satellite estimates)
  thresholds:
    minor_discrepancy_pct: 10.0   # > 10% triggers MINOR discrepancy
    major_discrepancy_pct: 25.0   # > 25% triggers MAJOR discrepancy

  # Data quality and satellite observation confidence thresholds
  confidence:
    max_cloud_cover_pct: 20.0       # Cloud cover > 20% drops confidence
    min_observation_count: 10       # Fewer than 10 valid observations drops confidence
    ndvi_saturation_threshold: 0.80 # Mean NDVI >= 0.80 flags saturation risk
    raw_ndvi_saturation_threshold: 0.85 # Raw NDVI >= 0.85 flags saturation risk near upper thresholds
    max_detection_limit_pct: 20.0   # Detection limit > 20% of claim drops confidence to LOW
    max_band_span_pct: 30.0         # Band span > 30% of claim drops confidence to LOW

extraction:
  # Default extractor: "rule_based" (100% free, no API key or external service needed)
  # Optional local LLM: "ollama" (fallback only for fields left missing by rule-based pass)
  extractor: "rule_based"
  ollama:
    base_url: "http://localhost:11434"
    model: "qwen2.5:7b"
    timeout_seconds: 30

pipeline:
  default_output_dir: "output"
  log_level: "INFO"

analysis:
  qc:
    min_boa_baseline: "04.00"
    min_red_p1_dn: 50.0
    min_valid_fraction: 0.5
    outlier_diff_threshold: 0.25
    temporal_window_days: 30
    min_offset_present_red_p1: 1100.0
    max_offset_absent_red_p1: 500.0
  estimate:
    dry_season_months: [6, 7, 8]
    bootstrap_resamples: 10000
    confidence_level: 0.95
    seed: 42
    ndvi_threshold_grid: [0.6, 0.65, 0.7, 0.75]
    hysteresis_cohort_pairs:
      - [0.5, 0.7]
      - [0.6, 0.7]
      - [0.6, 0.65]
      - [0.6, 0.75]
      - [0.7, 0.8]
    scheduled_plantings_ha:
      scheduled_2019_2020: 956.0
      scheduled_2020: 310.0
    pre_existing_loss:
      t_start: 0.7
      t_end: 0.6



